spring.application.name=traversebd-backend
server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DATABASE_URL:jdbc:postgresql://localhost:5432/traversebd}
spring.datasource.username=${SUPABASE_DATABASE_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:false}

app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-at-least-32-bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:tourism-media}

app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@traversebd.local}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@123456}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
management.endpoints.web.exposure.include=health,info
